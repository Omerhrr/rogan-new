###############################################
# Rogan Live — MediaMTX Configuration
# Compatible with MediaMTX v1.19.0+
# RTMP ingest + LL-HLS + WebRTC
###############################################

# General settings
logLevel: info
logDestinations: [stdout]

# Authentication — external webhook via our FastAPI backend.
# Uses backend:8000 (Docker bridge DNS) for local dev / Docker Desktop.
# NOTE for production (network_mode: host): change to http://localhost:8000/...
authMethod: http
authHTTPAddress: http://backend:8000/api/v1/mediamtx/auth
# Exclude API/metrics from external auth (they use internal auth)
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# Internal auth — allow read access for viewers without login
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
      - action: playback
        path:

# API server (for management / metrics)
api: true
apiAddress: :9997

# RTMP server — primary ingest point
rtmp: true
rtmpAddress: :1935

# HLS — Low-Latency HLS (LL-HLS) for viewer playback
#
# Using lowLatency variant (LL-HLS with partial segments) to achieve ~1-2s
# end-to-end latency instead of the ~6-10s latency of the fmp4 variant.
#
# Why this works now (previously caused black screens with fmp4):
#   - LL-HLS packaging requires H.264 video.
#   - WebRTC WHIP ingests used to pick VP8/VP9 (Chrome default).
#   - The frontend now forces H.264 first via setCodecPreferences() + SDP rewrite,
#     so MediaMTX always receives H.264 and can package it correctly.
#
# LL-HLS sends a 302 cookie-check redirect on first playlist request.
# Next.js middleware (src/middleware.ts) handles this transparently by
# rewriting /{uuid}/... paths back to /live/{uuid}/... for the proxy.
#
# hlsAlwaysRemux MUST be false: MediaMTX only creates the playlist once it
# has real video frames. With true, an empty manifest causes a blank video
# with no spinner — hls.js thinks the stream loaded but has no segments.
hls: true
hlsAddress: :8888
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 2s

# WebRTC — ultra-low-latency viewer playback + WHIP ingest
webrtc: true
webrtcAddress: :8889

# ICE transport configuration — LOCAL DEV (Docker Desktop / WSL2).
#
# Docker Desktop bridge networking:
#   - UDP port mapping goes through Docker's userspace proxy (docker-proxy), which
#     changes source ports on every forwarded packet. This breaks bidirectional
#     ICE STUN binding checks → UDP ICE candidates will fail.
#   - TCP port mapping uses iptables DNAT (kernel-level), which preserves source
#     ports correctly → TCP ICE candidates work fine.
#
# Strategy: advertise 127.0.0.1 as an additional ICE host so the browser finds
# MediaMTX via localhost. The browser will attempt both UDP (8189) and TCP (8190).
# UDP will fail silently; TCP will succeed via Docker DNAT.
#
# NOTE for production (network_mode: host on native Linux):
#   Remove webrtcAdditionalHosts — host networking gives MediaMTX the real public
#   IP in ICE candidates automatically, and Docker proxy is bypassed entirely.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8190
webrtcAdditionalHosts: ["127.0.0.1"]

# Default path settings — applies to all paths not explicitly named.
# Note: runOnPublish/runOnPublishComplete must live under paths, not pathDefaults,
# in MediaMTX v1.19.0.
pathDefaults:
  source: publisher
  sourceOnDemand: false
  record: true
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m

# Path configuration — "all_others" is MediaMTX's catch-all for any path
# not explicitly named. Stream keys are plain UUIDs generated by the backend.
# Lifecycle webhooks live here (not in pathDefaults) for v1.19.0 compatibility.
# In MediaMTX v1.x the publish lifecycle hooks are runOnReady / runOnNotReady,
# not runOnPublish / runOnPublishComplete.
# MTX_PATH and MTX_SOURCE_TYPE are injected by MediaMTX before running these.
paths:
  all_others:
    runOnReady: >-
      curl -sf --max-time 3 --retry 0
      -H "Content-Type: application/json"
      -d "{\"path\":\"$MTX_PATH\",\"source_type\":\"$MTX_SOURCE_TYPE\"}"
      http://backend:8000/api/v1/mediamtx/rtmp-publish || true
    runOnNotReady: >-
      curl -sf --max-time 3 --retry 0
      -H "Content-Type: application/json"
      -d "{\"path\":\"$MTX_PATH\"}"
      http://backend:8000/api/v1/mediamtx/rtmp-unpublish || true
